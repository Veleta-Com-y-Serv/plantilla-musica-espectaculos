  espectaculos:
    activa: true
    antetitulo: Espectáculos
    titulo: Elige cómo suena tu noche
    texto: "Cuatro formatos para cuatro tipos de fiesta. Todos con repertorio a la carta: dinos las canciones que no pueden faltar."
    cta: { texto: Pide presupuesto, url: "/#contratacion" }
    espectaculos:
      - { titulo: Verbena total, texto: "El espectáculo grande: pop, rock, rumba y los éxitos que canta todo el pueblo. Escenario, luces y dos pases con descanso.", duracion: "3 h en dos pases", formato: "Banda completa · 6 músicos", imagen: /fotos/espectaculo-verbena.jpg }
      - { titulo: Bodas en directo, texto: "Ceremonia en acústico, cóctel en trío y fiesta con la banda y DJ hasta el final. Ensayamos vuestro primer baile.", duracion: "De la ceremonia al último baile", formato: "Dúo, trío o banda + DJ", imagen: /fotos/espectaculo-boda.jpg }
      - { titulo: Tributo 80 y 90, texto: "Un viaje por la movida, el pop español y los himnos de las verbenas de los noventa, con vestuario y vídeo en pantalla.", duracion: "2 h", formato: "Banda + coristas", imagen: /fotos/espectaculo-tributo.jpg }
      - { titulo: Acústico, texto: "Formato pequeño para salas, restaurantes, cenas de empresa y terrazas. Sonido cuidado a volumen de conversación.", duracion: "90 min", formato: "Trío acústico", imagen: /fotos/espectaculo-acustico.jpg }

  banda:
    activa: true
    antetitulo: La banda
    titulo: Doce años subiendo a escenarios
    texto: "Empezamos tocando en las fiestas de los barrios de Murcia y hoy actuamos por toda la Región y las provincias vecinas.\n\nLlevamos nuestro propio equipo de sonido e iluminación y un técnico en cada actuación. Tú solo pones la fecha y las ganas."
    imagen: /fotos/banda-escenario.jpg
    personas:
      - { nombre: Laura Méndez, cargo: Voz, foto: /placeholders/persona.svg, texto: "Diez años cantando en orquestas de verbena." }
      - { nombre: Rubén Sáez, cargo: Guitarra y dirección musical, foto: /placeholders/persona.svg, texto: "Arregla cada canción para que suene a banda." }
      - { nombre: Ana Lucas, cargo: Teclados y coros, foto: /placeholders/persona.svg, texto: "" }
      - { nombre: Pedro Gil, cargo: Bajo, foto: /placeholders/persona.svg, texto: "" }
      - { nombre: Javi Moreno, cargo: Batería, foto: /placeholders/persona.svg, texto: "" }
      - { nombre: Clara Ibáñez, cargo: DJ y técnica de sonido, foto: /placeholders/persona.svg, texto: "" }

  videos:
    activa: true
    antetitulo: Vídeos
    titulo: Míranos en directo
    texto: "Grabados tal cual, sin retoques: así sonamos en una plaza, en una boda y en una sala."
    items:
      - { titulo: Directo en la Plaza Mayor, texto: "Fiestas patronales, verano de 2026.", duracion: "4:12", url: "https://www.youtube.com/", imagen: /fotos/video-plaza.jpg }
      - { titulo: El primer baile, texto: "Medley de boda en una finca de la huerta.", duracion: "3:05", url: "https://www.youtube.com/", imagen: /fotos/video-boda.jpg }
      - { titulo: Tributo 80 y 90, texto: "El final del espectáculo en la Sala Magnolia.", duracion: "5:40", url: "https://www.youtube.com/", imagen: /fotos/video-sala.jpg }

  galeria:
    activa: true
    antetitulo: Galería
    titulo: Noches que no se olvidan
    galeria:
      - /fotos/galeria-1.jpg
      - /fotos/galeria-2.jpg
      - /fotos/galeria-3.jpg
      - /fotos/galeria-4.jpg
      - /fotos/galeria-5.jpg
      - /fotos/galeria-6.jpg

  prensa:
    activa: true
    antetitulo: Lo que dicen
    titulo: Prensa y opiniones
    testimonios:
      - { texto: "Llenaron la plaza hasta las cuatro de la mañana y nadie se movió de la pista.", autor: Comisión de fiestas, nota: "Fiestas patronales, agosto de 2026" }
      - { texto: "Ensayaron nuestro primer baile y lo clavaron. Los invitados todavía nos lo comentan.", autor: Marta y Andrés, nota: Boda en Molina de Segura }
      - { texto: "Profesionales de principio a fin: llegaron con tiempo, montaron rápido y el sonido fue perfecto.", autor: Elena R., nota: Cena de empresa en Cartagena }
      - { texto: "Una de las bandas de versiones con más tablas de la Región.", autor: Crónica de un concierto, nota: Prensa local }

  contratacion:
    activa: true
    antetitulo: Contratación
    titulo: Que suene tu fiesta
    texto: "Cuéntanos la fecha, el sitio y el tipo de evento. Te respondemos en 24 horas laborables con la disponibilidad y una propuesta cerrada."
    boton_formulario: Pedir presupuesto
    tipos_evento: "Boda; Fiestas patronales; Evento de empresa; Sala o festival; Fiesta privada"
    cta: { texto: Escríbenos por WhatsApp, url: "https://wa.me/34644219037" }
    items:
      - { titulo: Nos dices la fecha, texto: "Y el lugar, el tipo de fiesta y cuánta gente esperas." }
      - { titulo: Te mandamos propuesta, texto: "Formato, duración, repertorio y todo lo que incluye." }
      - { titulo: Reservamos el día, texto: "Con una señal, y el resto el día de la actuación." }
      - { titulo: Subimos al escenario, texto: "Llegamos con tiempo, montamos y probamos sonido." }

  preguntas:
    activa: true
    antetitulo: Preguntas
    titulo: Antes de contratar
    preguntas:
      - { pregunta: "¿Con cuánta antelación hay que reservar?", respuesta: "Para verano y Navidad, cuanto antes: las fechas de fiestas se cierran con meses de antelación. El resto del año suele bastar con dos o tres meses." }
      - { pregunta: "¿Lleváis equipo de sonido y luces?", respuesta: "Sí. Llevamos sonido, iluminación y técnico propios, adaptados al tamaño del sitio. Si el lugar ya tiene escenario o equipo, lo usamos y ajustamos la propuesta." }
      - { pregunta: "¿Podemos elegir las canciones?", respuesta: "Claro. Te enviamos nuestro repertorio y nos dices las que no pueden faltar y las que no quieres oír. Para las bodas preparamos el primer baile." }
      - { pregunta: "¿Tocáis fuera de la Región de Murcia?", respuesta: "Sí: toda la Región, Alicante, Almería y Albacete. Para otras provincias, pregúntanos." }
      - { pregunta: "¿Qué necesitáis el día de la actuación?", respuesta: "Un espacio para el escenario, un enchufe cerca y acceso para descargar. Llegamos unas tres horas antes para montar y probar sonido." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Hablemos
    texto: "Llámanos, escríbenos o déjanos un mensaje. Si es para una fecha concreta, dínosla y te contamos si está libre."
    boton_formulario: Enviar mensaje
